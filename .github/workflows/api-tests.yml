name: API test automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rest-assured:
    name: Generate test report
    runs-on: ubuntu-latest
    outputs:
      test-exit-code: ${{ steps.tests.outputs.exit_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Start Sicredi API
        shell: bash
        run: |
          mvn -B -f sicredi_API/desafio-sicredi-master/prova-tecnica-api/pom.xml spring-boot:run > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API health check
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat api.log
          exit 1

      - name: Run automated API tests
        id: tests
        shell: bash
        run: |
          set +e
          mvn -B -f testes_automatizados/desafiosicredi/pom.xml test -Denv=local
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate Allure report
        if: always()
        run: mvn -B -f testes_automatizados/desafiosicredi/pom.xml allure:report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          if-no-files-found: ignore
          path: |
            api.log
            testes_automatizados/desafiosicredi/target/surefire-reports/
            testes_automatizados/desafiosicredi/target/allure-results/
            testes_automatizados/desafiosicredi/target/allure-reports/
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Allure report for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: testes_automatizados/desafiosicredi/target/allure-reports

      - name: Stop Sicredi API
        if: always()
        shell: bash
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

  deploy-report:
    name: Publish Allure report
    if: github.event_name != 'pull_request'
    needs: rest-assured
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  quality-gate:
    name: Preserve test result status
    if: always()
    needs:
      - rest-assured
      - deploy-report
    runs-on: ubuntu-latest

    steps:
      - name: Fail workflow if automated tests failed
        shell: bash
        run: |
          exit_code="${{ needs.rest-assured.outputs.test-exit-code }}"

          if [ -z "$exit_code" ]; then
            echo "Automated tests did not finish or did not report an exit code."
            exit 1
          fi

          if [ "$exit_code" != "0" ]; then
            echo "Automated tests finished with failures. Allure report and artifacts were still generated."
            exit "$exit_code"
          fi

          echo "Automated tests passed."
